<!DOCTYPE html>
<html lang="en">
<head>
  <!-- Replaced by flutter build's --base-href. -->
  <base href="$FLUTTER_BASE_HREF">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="description" content="Maps, routes, tolls and turn-by-turn navigation for Malaysia. No Google.">
  <meta name="theme-color" content="#FFF7F0">
  <!-- Add to Home Screen: full screen, Arah's own name and icon. -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Arah">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="icon" type="image/png" href="favicon.png">
  <link rel="manifest" href="manifest.json">
  <title>Arah</title>
  <style>
    html, body { margin: 0; height: 100%; background: #FFD6E2; }
    #splash { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; }
    #splash img { width: 112px; height: 112px; border-radius: 26px; }
    /* The browser map ignores the app's compass margins: keep it clear of the
       search bar and the category chips. */
    .maplibregl-ctrl-top-right { top: calc(env(safe-area-inset-top) + 134px) !important; }
  </style>
</head>
<body>
  <div id="splash"><img src="icons/Icon-192.png" alt="Arah"></div>
  <script>
    // Remove the splash once Flutter has drawn its first frame.
    window.addEventListener('flutter-first-frame', () => document.getElementById('splash')?.remove());
  </script>
  <script>
    // Arabic labels (Palestine, place names) need MapLibre's right-to-left
    // text plugin in the browser; the phone apps have it built in. The map
    // plugin publishes window.maplibregl once it has loaded the library.
    (function rtl(tries) {
      const m = window.maplibregl;
      if (m && m.setRTLTextPlugin) {
        try {
          if (!m.getRTLTextPluginStatus || m.getRTLTextPluginStatus() === 'unavailable') {
            Promise.resolve(m.setRTLTextPlugin('https://unpkg.com/@mapbox/mapbox-gl-rtl-text@0.3.0/dist/mapbox-gl-rtl-text.js', false)).catch(() => {});
          }
        } catch (e) {}
      } else if (tries < 600) {
        setTimeout(() => rtl(tries + 1), 50);
      }
    })(0);
  </script>
  <script>
    // MapLibre opens the map credits expanded on load, over the bottom sheets.
    // Start them folded into the (i) button, as on the phone apps; tapping it
    // still shows them.
    new MutationObserver(() => {
      for (const el of document.querySelectorAll('.maplibregl-ctrl-attrib.maplibregl-compact-show:not([data-folded])')) {
        el.dataset.folded = '1';
        el.classList.remove('maplibregl-compact-show');
        el.removeAttribute('open');
      }
    }).observe(document.documentElement, { subtree: true, childList: true, attributes: true, attributeFilter: ['class'] });
  </script>
  <script>
    // iPhone Safari caps the graphics memory a page may use. A 3x map canvas
    // next to Flutter's own canvas can go over it, and Safari then quietly gives
    // the map a smaller drawing buffer and stretches it (tall, squeezed map,
    // labels and Mochi). So: draw maps at most at 2x, and if a map's buffer
    // still comes out smaller than its canvas, step its sharpness down and
    // redraw. Also redraw when the visible area changes (keyboard, toolbar).
    (function guard(tries) {
      const m = window.maplibregl;
      if (!m || !m.Map) { if (tries < 600) setTimeout(() => guard(tries + 1), 50); return; }
      const maps = new Set();
      const P = m.Map.prototype, repaint = P.triggerRepaint;
      P.triggerRepaint = function () {
        if (!maps.has(this)) {
          maps.add(this);
          try { if (this.getPixelRatio() > 2) this.setPixelRatio(2); } catch (e) {}
        }
        return repaint.apply(this, arguments);
      };
      function check() {
        for (const map of maps) {
          if (map._removed) { maps.delete(map); continue; }
          try {
            const gl = map.painter && map.painter.context && map.painter.context.gl;
            const c = map.getCanvas();
            if (gl && (gl.drawingBufferWidth < c.width - 1 || gl.drawingBufferHeight < c.height - 1)) {
              map.setPixelRatio(Math.max(1, map.getPixelRatio() * 0.75));
            }
            const box = map.getContainer();
            if (Math.abs(box.clientWidth - c.clientWidth) > 1 || Math.abs(box.clientHeight - c.clientHeight) > 1) map.resize();
          } catch (e) {}
        }
      }
      setInterval(check, 1500);
      const soon = () => setTimeout(check, 300);
      window.addEventListener('resize', soon);
      window.addEventListener('orientationchange', soon);
      document.addEventListener('visibilitychange', soon);
      if (window.visualViewport) window.visualViewport.addEventListener('resize', soon);
    })(0);
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
