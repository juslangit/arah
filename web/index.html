<!DOCTYPE html>
<html lang="en">
<head>
  <!-- Replaced by flutter build's --base-href. -->
  <base href="$FLUTTER_BASE_HREF">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="description" content="Maps, routes, tolls and turn-by-turn navigation for Malaysia. No Google.">
  <meta name="theme-color" content="#FFF7F0">
  <!-- Add to Home Screen: full screen, Arah's own name and icon. -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Arah">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="icon" type="image/png" href="favicon.png">
  <link rel="manifest" href="manifest.json">
  <title>Arah</title>
  <style>
    html, body { margin: 0; height: 100%; background: #FFD6E2; }
    #splash { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; }
    #splash img { width: 112px; height: 112px; border-radius: 26px; }
    /* The browser map ignores the app's compass margins: keep it clear of the
       search bar and the category chips. */
    .maplibregl-ctrl-top-right { top: calc(env(safe-area-inset-top) + 134px) !important; }
  </style>
</head>
<body>
  <div id="splash"><img src="icons/Icon-192.png" alt="Arah"></div>
  <script>
    // Remove the splash once Flutter has drawn its first frame.
    window.addEventListener('flutter-first-frame', () => document.getElementById('splash')?.remove());
  </script>
  <script>
    // Arabic labels (Palestine, place names) need MapLibre's right-to-left
    // text plugin in the browser; the phone apps have it built in. The map
    // plugin publishes window.maplibregl once it has loaded the library.
    (function rtl(tries) {
      const m = window.maplibregl;
      if (m && m.setRTLTextPlugin) {
        try {
          if (!m.getRTLTextPluginStatus || m.getRTLTextPluginStatus() === 'unavailable') {
            Promise.resolve(m.setRTLTextPlugin('https://unpkg.com/@mapbox/mapbox-gl-rtl-text@0.3.0/dist/mapbox-gl-rtl-text.js', false)).catch(() => {});
          }
        } catch (e) {}
      } else if (tries < 600) {
        setTimeout(() => rtl(tries + 1), 50);
      }
    })(0);
  </script>
  <style>
    /* No (i) credits button on the map: the credits are in Settings → About. */
    .maplibregl-ctrl-attrib, .maplibregl-ctrl-bottom-left .maplibregl-ctrl-attrib { display: none !important; }
  </style>
  <script>
    // iPhone Safari caps the graphics memory a page may use. A 3x map canvas
    // next to Flutter's own canvas can go over it, and Safari then quietly gives
    // the map a smaller drawing buffer and stretches it (tall, squeezed map,
    // labels and Mochi). So: draw maps at most at 2x, and if a map's buffer
    // still comes out smaller than its canvas, step its sharpness down and
    // redraw. Also redraw when the visible area changes (keyboard, toolbar).
    (function guard(tries) {
      const m = window.maplibregl;
      if (!m || !m.Map) { if (tries < 600) setTimeout(() => guard(tries + 1), 50); return; }
      const maps = new Set();
      const P = m.Map.prototype, repaint = P.triggerRepaint;
      P.triggerRepaint = function () {
        if (!maps.has(this)) {
          maps.add(this);
          try { if (this.getPixelRatio() > 2) this.setPixelRatio(2); } catch (e) {}
        }
        return repaint.apply(this, arguments);
      };
      function check() {
        for (const map of maps) {
          if (map._removed) { maps.delete(map); continue; }
          try {
            const gl = map.painter && map.painter.context && map.painter.context.gl;
            const c = map.getCanvas();
            if (gl && (gl.drawingBufferWidth < c.width - 1 || gl.drawingBufferHeight < c.height - 1)) {
              map.setPixelRatio(Math.max(1, map.getPixelRatio() * 0.75));
            }
            const box = map.getContainer();
            if (Math.abs(box.clientWidth - c.clientWidth) > 1 || Math.abs(box.clientHeight - c.clientHeight) > 1) map.resize();
            // The drawing's shape must match the shape on screen; if it
            // doesn't, the map shows stretched. Redraw it at the screen shape.
            const r = c.getBoundingClientRect();
            if (r.width > 0 && r.height > 0 && c.width > 0 && c.height > 0 &&
                Math.abs((c.height / c.width) / (r.height / r.width) - 1) > 0.03) {
              fixes++;
              map.resize();
            }
          } catch (e) {}
        }
      }
      let fixes = 0;
      // Hidden size readout for chasing the stretch on a real iPhone: open
      // the app with #debug at the end of the address.
      let panel = null;
      function readout() {
        const out = ['window ' + innerWidth + 'x' + innerHeight + ' dpr ' + devicePixelRatio +
          (window.visualViewport ? ' vv ' + Math.round(visualViewport.width) + 'x' + Math.round(visualViewport.height) + ' s' + visualViewport.scale.toFixed(2) : '') +
          ' standalone ' + !!navigator.standalone + ' fixes ' + fixes];
        for (const map of maps) {
          try {
            const c = map.getCanvas(), b = map.getContainer(), r = c.getBoundingClientRect();
            const gl = map.painter && map.painter.context && map.painter.context.gl;
            const tr = [];
            for (let e = b; e && e !== document.documentElement; e = e.parentElement) {
              const s = getComputedStyle(e).transform;
              if (s && s !== 'none' && !/^matrix\(1, 0, 0, 1,/.test(s)) tr.push(e.tagName.toLowerCase() + ' ' + s);
            }
            out.push('map box ' + b.clientWidth + 'x' + b.clientHeight + ' css ' + c.clientWidth + 'x' + c.clientHeight +
              ' rect ' + Math.round(r.width) + 'x' + Math.round(r.height) + ' attr ' + c.width + 'x' + c.height +
              (gl ? ' buf ' + gl.drawingBufferWidth + 'x' + gl.drawingBufferHeight + (gl.isContextLost() ? ' LOST' : '') : ' nogl') +
              ' pr ' + map.getPixelRatio() +
              (map.painter ? ' painter ' + map.painter.width + 'x' + map.painter.height : '') +
              (gl ? ' view ' + Array.from(gl.getParameter(gl.VIEWPORT)).join(',') : '') + (tr.length ? '\n  ' + tr.join('\n  ') : ''));
          } catch (e) { out.push('map ? ' + e.message); }
        }
        panel.textContent = out.join('\n');
      }
      function toggleReadout() {
        if (panel) { clearInterval(panel.timer); panel.remove(); panel = null; return; }
        panel = document.createElement('pre');
        panel.style.cssText = 'position:fixed;left:8px;right:8px;top:calc(env(safe-area-inset-top) + 8px);z-index:99999;margin:0;padding:10px;' +
          'background:rgba(0,0,0,.8);color:#fff;font:11px/1.4 ui-monospace,Menlo,monospace;white-space:pre-wrap;border-radius:12px;pointer-events:none';
        document.body.appendChild(panel);
        readout();
        panel.timer = setInterval(readout, 500);
      }
      if (location.hash === '#debug') toggleReadout();
      setInterval(check, 1500);
      // After a rotation or any size change, iPhone Safari can keep showing
      // the map's old drawing surface stretched to the new shape even though
      // every size reads correct. So once the screen has settled, rebuild the
      // surface outright (setting the pixel ratio re-creates the canvas
      // buffer) instead of trusting the sizes.
      function rebuild() {
        for (const map of maps) {
          if (map._removed) continue;
          try {
            map.resize();
            map.setPixelRatio(map.getPixelRatio());
            map.triggerRepaint();
          } catch (e) {}
        }
      }
      let timers = [];
      const soon = () => {
        timers.forEach(clearTimeout);
        timers = [300, 900, 2000].map((ms) => setTimeout(() => { check(); rebuild(); }, ms));
      };
      window.addEventListener('resize', soon);
      window.addEventListener('orientationchange', soon);
      if (screen.orientation) screen.orientation.addEventListener('change', soon);
      document.addEventListener('visibilitychange', soon);
      window.addEventListener('pageshow', soon);
      if (window.visualViewport) window.visualViewport.addEventListener('resize', soon);
    })(0);
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
